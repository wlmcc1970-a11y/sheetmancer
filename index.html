<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overscroll-behavior:none;background:#0A0A0C}body{background:#0A0A0C;font-family:'EB Garamond',Georgia,serif;color:#F2E8D4;overflow-x:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body,div,button,span,input,p{transition:background-color 0.25s ease,color 0.25s ease,border-color 0.25s ease}
input,button{font-family:inherit}
#root{min-height:100vh}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
/* Emissive "breathing" applied on top of the static stacked text-shadow set per-theme in T.nameGlow */
@keyframes nameGlow{0%,100%{filter:brightness(1) drop-shadow(0 0 6px var(--glow-color,rgba(212,168,67,0.30)))}50%{filter:brightness(1.06) drop-shadow(0 0 16px var(--glow-color,rgba(212,168,67,0.50)))}}
@keyframes subtlePulse{0%,100%{opacity:0.5}50%{opacity:0.8}}
@keyframes scanLine{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Slow specular sweep for metallic surfaces */
@keyframes metalSheen{0%{background-position:-180% center}100%{background-position:280% center}}
/* Chip press-in micro feedback */
@keyframes chipPop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.atmo-bg{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:0;background-attachment:fixed}
.atmo-bg::before,.atmo-bg::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
#root{position:relative;z-index:1}
/* Fine-tuned easing for interactive accents — chips & tabs expand smoothly */
.ss-chip{transition:transform .34s cubic-bezier(.2,.85,.25,1.05),box-shadow .34s cubic-bezier(.2,.85,.25,1),background .3s ease,color .25s ease,border-color .3s ease,letter-spacing .3s ease}
.ss-chip:active{transform:scale(.95)}
.ss-card{transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s cubic-bezier(.2,.85,.25,1)}
.ss-jump{animation:ssJumpFlash 1.9s ease}
@keyframes ssJumpFlash{0%{box-shadow:0 0 0 0 transparent}16%{box-shadow:0 0 0 3px var(--jc,#D4A843),0 0 18px var(--jc,#D4A843)}70%{box-shadow:0 0 0 3px var(--jc,#D4A843),0 0 18px var(--jc,#D4A843)}100%{box-shadow:0 0 0 0 transparent}}
.ss-card:active{transform:translateY(1px)}
.ss-press{transition:transform .2s cubic-bezier(.2,.85,.25,1),box-shadow .2s ease,filter .2s ease}
.ss-press:active{transform:translateY(1px) scale(.985);filter:brightness(1.05)}
</style>

<style id="ss-chassis">
#root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#root{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@keyframes ssScan{0%{top:0}100%{top:calc(100% - 3px)}}
@keyframes ssCatIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
#root input,#root textarea,#root select,#root [contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}



#ssToast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:9001;display:none;max-width:88%;padding:12px 18px;border:1px solid #D4A843;border-radius:14px;background:#15131a;color:#F2E8D4;font-family:'EB Garamond',Georgia,serif;font-size:14px;text-align:center;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.55)}
#ssToast.show{display:block;animation:ssRise .35s ease}
#ssUpdate{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:9100;display:none;align-items:center;gap:8px;max-width:92%;padding:10px 16px;border:1px solid #D4A843;border-radius:14px;background:linear-gradient(135deg,#1a1620,#0A0A0C);color:#F2E8D4;font-family:'Cinzel',Georgia,serif;font-size:14px;font-weight:700;letter-spacing:.3px;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 16px rgba(212,168,67,.3)}
#ssUpdate.show{display:flex;animation:ssRise .35s ease}
#ssUpdate .pill{padding:4px 12px;border-radius:12px;background:#D4A843;color:#0A0A0C;font-size:12px;white-space:nowrap}
@keyframes ssRise{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>

<script>const {
  useState,

} = React;

/* ━━━━ CONFIG ━━━━ */
// Replace with your Cloudflare Worker URL when ready
const API_URL = 'https://sheetsnap-api.will-6d6.workers.dev';

// Model, max_tokens and the extraction prompt are pinned SERVER-SIDE in the
// Worker (fiscal fortress L4/L7). Extraction runs on Opus, then an independent
// Sonnet pass double-checks every field before results reach the user.
// The client sends ONLY images + a verified Firebase identity token.

// Hard cap on pages per scan (audit H7 / locked decision). Enforced at capture.
const MAX_PAGES = 10;

/* Character slots included with a purchase (launch entitlement). One successful
   scan spends one slot (tracked client-side in ss-scanCount; server-enforced at
   launch). Flip / raise this one constant for heavy testing or at launch. */
const INCLUDED_SLOTS = 3;

/* Downscale a data-URL image to a max long-edge before sending to the API.
   Keeps payload small and predictable (~1568px high-res cap) without hurting
   text legibility. Falls back to the original on any error. */
function downscaleImage(dataUrl, maxDim = 1568, quality = 0.82) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width,
          h = img.naturalHeight || img.height;
        if (!w || !h) {
          resolve(dataUrl);
          return;
        }
        if (Math.max(w, h) > maxDim) {
          const sc = maxDim / Math.max(w, h);
          w = Math.round(w * sc);
          h = Math.round(h * sc);
        }
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        if (!ctx) {
          resolve(dataUrl);
          return;
        }
        ctx.drawImage(img, 0, 0, w, h);
        try {
          resolve(c.toDataURL("image/jpeg", quality));
        } catch (e) {
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    } catch (e) {
      resolve(dataUrl);
    }
  });
}

/* ━━━━ STORAGE ━━━━ */
/* P1 haptics: subtle, sparing vibration on key moments (Android; iOS safely ignores) */
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(_){}}
const store = {
  get: k => {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  },
  set: (k, v) => {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      return true;
    } catch (e) {
      if (e.name === "QuotaExceededError" || e.code === 22) {
        store._full = true;
      }
      return false;
    }
  },
  _full: false
};

            if(/popup-blocked|popup-closed-by-user|cancelled-popup-request|operation-not-supported/.test(c))
              finish(false,derr("reauth-unavailable","We couldn't open the sign-in window, so nothing has been changed. Please sign out, sign in again, then delete your account."));
            /* anything else: let the watcher or the timeout decide */
          });
        }catch(e){finish(false,derr("reauth-unavailable","We couldn't open the sign-in window, so nothing has been changed. Please sign out, sign in again, then delete your account."));}
      });
    }
    /* STEP 1 - reauthenticate. Nothing is destroyed if this fails, times out, or is
       cancelled, so the UI keeps an escape open for the whole step. */
    raceOut(reauthStep(),REAUTH_MS,
      derr("reauth-timeout","We didn't hear back from the sign-in window. Nothing has been changed — please try again."))
    .then(function(){
     if(stale())throw derr("cancelled","Cancelled — nothing has changed.");
     var cur=auth.currentUser;
     if(!cur||cur.uid!==uid)throw derr("identity-changed","Something changed while we were working. Nothing has been deleted — please try again.");
     /* captured while the account is alive; outlives it by design */
     return raceOut(cur.getIdToken(true),30000,derr("token-timeout","We couldn't confirm your sign-in just now. Nothing has been changed — please try again."));
    }).then(function(tok){
     if(stale())throw derr("cancelled","Cancelled — nothing has changed.");
     savedTok=tok;
     if(opts.onDestructive){try{opts.onDestructive();}catch(_){}}   /* past the point of cancelling */
     deleting=true;deletedUids[uid]=1;                 /* stop the sync loop re-creating the doc */
     deleteTimer=setTimeout(timedOut,DESTRUCT_MS);
     /* STEP 2 - tombstone, before anything is destroyed. merge:true so a retry after
        a lost ack is a harmless no-op rather than a permanent brick. */
     tombIssued=true;
     return fsM.setDoc(tomb(uid),{deletedAt:Date.now()},{merge:true});
    }).then(function(){
     phase=1;
     /* STEP 3 - the cloud copy. Characters on this device are deliberately kept. */
     return fsM.deleteDoc(ref(uid));
    }).then(function(){
     phase=2;
     var c2=auth.currentUser;
     if(!c2||c2.uid!==uid)throw derr("identity-changed","Your cloud copy was removed, but we could not finish deleting the account. Please sign in and try again.");
     /* STEP 4 - the auth user itself. If Firebase still judges the sign-in too old,
        reauthenticate and retry ONCE rather than stopping here with the cloud copy
        already gone - a half-deleted account is the worst outcome available. */
     return authM.deleteUser(c2).catch(function(e){
       if(!e||e.code!=="auth/requires-recent-login")throw e;
       if(deleteTimer){clearTimeout(deleteTimer);deleteTimer=null;}   /* the popup may outlive DESTRUCT_MS */
       return reauthStep().then(function(){
         var c3=auth.currentUser;
         if(!c3||c3.uid!==uid)throw derr("identity-changed","Your cloud copy was removed, but we could not finish deleting the account. Please sign in and try again.");
         deleteTimer=setTimeout(timedOut,DESTRUCT_MS);
         return authM.deleteUser(c3);
       });
     });
    }).then(function(){
     phase=3;
     /* STEP 5 - server-side purge. Best effort: the account is already gone, and a
        failure here must never look like a failed deletion to the user. The outcome
        is recorded for diagnostics - if a wrapped build's origin is missing from the
        Worker's ALLOWED_ORIGINS this is where it shows up. */
     return raceOut(fetch(SS_API+"/account",{method:"DELETE",headers:{Authorization:"Bearer "+savedTok}}),15000,derr("purge-timeout","purge timed out"))
      .then(function(r){window.ssLastPurge={ok:!!r.ok,status:r.status};if(!r.ok)try{console.warn("Sheetmancer: account purge returned "+r.status);}catch(_){}},
            function(err){window.ssLastPurge={ok:false,status:0};try{console.warn("Sheetmancer: account purge failed",err);}catch(_){}});
    }).then(succeed).catch(function(e){
     if(!e||typeof e!=="object")e=new Error(String(e||"delete-failed"));
     var code=String(e.code||e.message||"");
     var fixed=e.ssMsg;                                 /* messages raised above are already true */
     recover(e,function(st){
      var tail=(tombIssued&&!st.tombGone)?" Syncing is paused on this device until a delete succeeds — reopening the app in a few minutes clears it.":"";
      if(st.gone){
       /* phase 3 = the account really is gone. phase 2 = only the cloud copy is. */
       if(phase>=3)return "Your account was removed, but we couldn't confirm the last step. Nothing more is needed on this device — the characters here are safe.";
       if(phase>=2)return "Your cloud copy was removed, but you're no longer signed in to that account, so we couldn't finish deleting it. Sign in again and try once more — the characters on this device are safe."+tail;
       return "You're no longer signed in to that account, so we stopped before finishing. Sign in again and try once more — the characters on this device are safe."+tail;
      }
      if(fixed&&phase<2)return fixed;
      if(phase>=2){
       return (st.restored
        ? "We removed your cloud copy but couldn't delete the account itself. The characters on this device are safe, and the cloud copy has been put back."
        : "We removed your cloud copy but couldn't delete the account itself. The characters on this device are safe, but we couldn't put the cloud copy back yet.")+" Please try again."+tail;
      }
      if(phase===1)return "We couldn't remove your cloud copy. Nothing has been deleted — please try again."+tail;
      /* phase 0 - nothing was destroyed. Popups only ever fail here. */
      if(/popup-blocked/i.test(code))return "Your browser blocked the confirmation window. Allow pop-ups for this site, then try again.";
      if(/popup|cancel|closed/i.test(code))return "Confirmation was cancelled — nothing has changed.";
      return "We couldn't finish that just now. Your account has not been changed."+tail;
     });
    });
   });
  };
  function ref(uid){return fsM.doc(db,"users",uid);}
  function push(){if(!user)return;
   /* Blocked, not synced - a delete in flight or a tombstone standing. Say so. */
   if(deleting||deletedUids[user.uid]){if(!errState){errState=true;broadcast();}return;}
   var uu=user.uid;var s=JSON.stringify(gather());if(s===last)return;last=s;syncing=true;broadcast();fsM.setDoc(ref(uu),{sheetsnap_blob:s,sheetsnap_updatedAt:Date.now()},{merge:true}).then(function(){lastSyncedAt=Date.now();syncing=false;errState=false;broadcast();}).catch(function(e){syncing=false;errState=true;if(/permission/i.test(String((e&&(e.code||e.message))||"")))deletedUids[uu]=1;else last="";broadcast();});}
  /* A deletion that died between the tombstone and the finish would otherwise leave
     the account permanently unable to sync, silently and with no way back. On sign-in,
     an OLD tombstone (older than the few seconds a real deletion takes) is reconciled:
     force a token refresh - it fails if the auth user is really gone - and only clear
     the tombstone when the account provably still exists. A young tombstone is left
     alone so a deletion in flight on another device is never undone. */
  var TOMB_STRANDED_MS=300000;
  function reconcile(u){
   return fsM.getDoc(tomb(u.uid)).then(function(t){
    if(!t.exists())return true;
    var at=((t.data()||{}).deletedAt)||0;
    if(Date.now()-at<TOMB_STRANDED_MS)return true;
    return u.getIdToken(true).then(function(){
     return fsM.deleteDoc(tomb(u.uid)).then(function(){delete deletedUids[u.uid];return true;},function(){return true;});
    },function(err){
     var c=String((err&&(err.code||err.message))||"");
     /* Only these PROVE the account is gone. A network blip must never sign anyone out. */
     if(/user-token-expired|user-not-found|user-disabled|invalid-user-token/i.test(c)){try{authM.signOut(auth);}catch(e){}return false;}
     errState=true;return true;
    });
   },function(){return true;});
  }
  function loadCloud(u){
    return fsM.getDoc(ref(u.uid)).then(function(snap){
     var d=snap.exists()?snap.data():null;
     if(d&&d.sheetsnap_blob){try{var c=JSON.parse(d.sheetsnap_blob);if(apply(c)&&!sessionStorage.getItem("ss-sync-reloaded")){sessionStorage.setItem("ss-sync-reloaded","1");location.reload();return;}}catch(e){}}
     last=JSON.stringify(gather());lastSyncedAt=Date.now();syncing=false;errState=false;broadcast();push();
    }).catch(function(e){syncing=false;errState=navigator.onLine;broadcast();});
  }
  authM.onAuthStateChanged(auth,function(u){
   user=(u&&u.isAnonymous)?null:u;
   pending=false;
   if(u&&!u.isAnonymous){
    syncing=true;broadcast();
    reconcile(u).then(function(go){if(!go){syncing=false;broadcast();return;}return loadCloud(u);})
     .catch(function(){syncing=false;errState=navigator.onLine;broadcast();});
   } else { syncing=false;broadcast(); }
  });
  setInterval(function(){if(user){var s=JSON.stringify(gather());if(s!==last){if(timer)clearTimeout(timer);timer=setTimeout(push,1200);}}},2000);
  window.addEventListener("pagehide",push);
  document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")push();});
  window.addEventListener("online",function(){if(user){broadcast();push();}else broadcast();});
  window.addEventListener("offline",broadcast);
  setInterval(function(){if(user&&!syncing&&navigator.onLine)broadcast();},20000);
 }).catch(function(){window.ssAuth={signedIn:false,email:"",status:"Sign in",detail:"sync offline"};try{window.dispatchEvent(new CustomEvent("ss-auth"));}catch(e){}});
})();</script>
</body>
