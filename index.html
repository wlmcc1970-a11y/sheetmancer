@keyframes metalSheen{0%{background-position:-180% center}100%{background-position:280% center}}

@keyframes chipPop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

.atmo-bg::before,.atmo-bg::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
#root{position:relative;z-index:1}

.ss-chip{transition:transform .34s cubic-bezier(.2,.85,.25,1.05),box-shadow .34s cubic-bezier(.2,.85,.25,1),background .3s ease,color .25s ease,border-color .3s ease,letter-spacing .3s ease}
.ss-chip:active{transform:scale(.95)}
.ss-card{transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s cubic-bezier(.2,.85,.25,1)}
.ss-jump{animation:ssJumpFlash 1.9s ease}
@keyframes ssJumpFlash{0%{box-shadow:0 0 0 0 transparent}16%{box-shadow:0 0 0 3px var(--jc,#D4A843),0 0 18px var(--jc,#D4A843)}70%{box-shadow:0 0 0 3px var(--jc,#D4A843),0 0 18px var(--jc,#D4A843)}100%{box-shadow:0 0 0 0 transparent}}
.ss-card:active{transform:translateY(1px)}
.ss-press{transition:transform .2s cubic-bezier(.2,.85,.25,1),box-shadow .2s ease,filter .2s ease}
.ss-press:active{transform:translateY(1px) scale(.985);filter:brightness(1.05)}

  /* The app frames portraits 3:4 with a cover-fit + user zoom. Reproduce that here so
     the PDF shows the same crop instead of squashing the original into a square.
     NOTE: pan is stored in on-screen CSS pixels relative to the live frame element,
     which is not knowable at export time — applying it blind could push a face out of
     frame, so the crop is centred. Zoom is unitless and is applied faithfully. */

    var settled = false;
    var done = function (fn, v) { if (!settled) { settled = true; fn(v); } };

/* ━━━━ CONFIG ━━━━ */
// Replace with your Cloudflare Worker URL when ready
const API_URL = 'https://sheetsnap-api.will-6d6.workers.dev';

// Model, max_tokens and the extraction prompt are pinned SERVER-SIDE in the
// Worker (fiscal fortress L4/L7). Extraction runs on Opus, then an independent
// Sonnet pass double-checks every field before results reach the user.
// The client sends ONLY images + a verified Firebase identity token.

// Hard cap on pages per scan (audit H7 / locked decision). Enforced at capture.
const MAX_PAGES = 10;

/* Character slots included with a purchase (launch entitlement). One successful
   scan spends one slot (tracked client-side in ss-scanCount; server-enforced at
   launch). Flip / raise this one constant for heavy testing or at launch. */
const INCLUDED_SLOTS = 3;

/* Downscale a data-URL image to a max long-edge before sending to the API.
   Keeps payload small and predictable (~1568px high-res cap) without hurting
   text legibility. Falls back to the original on any error. */
function downscaleImage(dataUrl, maxDim = 1568, quality = 0.82) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width,
          h = img.naturalHeight || img.height;
        if (!w || !h) {
          resolve(dataUrl);
          return;
        }
        if (Math.max(w, h) > maxDim) {
          const sc = maxDim / Math.max(w, h);
          w = Math.round(w * sc);
          h = Math.round(h * sc);
        }
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        if (!ctx) {
          resolve(dataUrl);
          return;
        }
        ctx.drawImage(img, 0, 0, w, h);
        try {
          resolve(c.toDataURL("image/jpeg", quality));
        } catch (e) {
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    } catch (e) {
      resolve(dataUrl);
    }
  });
}

/* ━━━━ HEIC SUPPORT (lazy) ━━━━ */
function ssShowToast(msg, ms) {
  try {
    var t = document.getElementById("ssToast");
    if (!t) return;
    t.onclick = function () { t.classList.remove("show"); };
    t.textContent = msg;
    t.classList.add("show");
    if (t.__ssHide) clearTimeout(t.__ssHide);
    t.__ssHide = setTimeout(function () { t.classList.remove("show"); }, ms || 8000);
  } catch (e) {}
}
function isHeicFile(file) {
  if (!file) return false;
  var t = (file.type || "").toLowerCase();
  if (t === "image/heic" || t === "image/heif" || t === "image/heic-sequence" || t === "image/heif-sequence") return true;

   so EXIF-rotated phone JPEGs came out garbled and failed extraction — reverted here.)

   or null if the browser can't decode it (e.g. HEIC on Chrome/Android). Identical to the

      if (!w || !h) { resolve(null); return; }

      var ctx = c.getContext("2d");

/* Turn ANY uploaded image into a downscaled, UPRIGHT JPEG data URL for scanning/portraits.
   Decode first (JPEG/PNG everywhere + HEIC on Safari/iOS); only if that fails AND the file is
   HEIC/HEIF do we spin up the heavy converter, then decode its JPEG output the same way.
   Throws if the image can't be read — callers skip it and show a friendly note, so a
   blank/undecodable image is NEVER sent onward to the paid scan. */
async function fileToScanJpeg(file, maxDim, quality) {
  var jpeg = await decodeUprightJpeg(file, maxDim, quality);
  if (jpeg) return jpeg;
  if (isHeicFile(file)) {
    var blob = await heicToJpegBlob(file);
    jpeg = await decodeUprightJpeg(blob, maxDim, quality);
    if (jpeg) return jpeg;
  }
  throw new Error("unreadable image");
}

const store = {
  get: k => {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  },
  set: (k, v) => {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      return true;
    } catch (e) {
      if (e.name === "QuotaExceededError" || e.code === 22) {
        store._full = true;
      }
      return false;
    }
  },
  _full: false
};

    not.style.cssText = "appearance:none;border:1px solid #4a3b78;background:transparent;color:#cfc7e6;font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;cursor:pointer;min-height:44px;";
    not.addEventListener("click", snooze);
    var rate = document.createElement("button");
    rate.type = "button"; rate.textContent = "Rate Sheetmancer";
    rate.style.cssText = "appearance:none;border:none;background:#b8862b;color:#1c1830;font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:10px;cursor:pointer;min-height:44px;";
    rate.addEventListener("click", openPlay);
    row.appendChild(not); row.appendChild(rate);
    wrap.appendChild(h); wrap.appendChild(p); wrap.appendChild(row);
    (document.body || document.documentElement).appendChild(wrap);
    try { document.addEventListener("keydown", onKey, true); } catch (_) {}
  }
  window.ssMaybeAskReview = function () {
    try {
      if (alreadyResolved()) return;
      var n = lget("ss-scanCount") || 0;
      if (n < 2) return;                 /* wait for the 2nd successful scan */
      if (!navigator.onLine) return;     /* skip offline */
      var h = iosReviewHandler();
      if (h) {                           /* iOS: Apple's native overlay */
        try { h.postMessage({}); } catch (_) {}
        lset("ss-review-done", 1);       /* don't re-ask; iOS also rate-limits */
        return;
      }
      if (isIOSShell()) return;          /* iOS without the handler yet: show nothing (never a web card on iOS) */
      if (!isMobileish()) return;        /* suppress on desktop */
      lset("ss-review-snooze", Date.now() + SHOWN_MS);  /* shown once → don't nag every scan if ignored */
      showCard();
    } catch (_) { /* a rating prompt must never affect the app */ }
  };
})();
</script>
