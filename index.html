@keyframes metalSheen{0%{background-position:-180% center}100%{background-position:280% center}}

@keyframes chipPop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}

.atmo-bg::before,.atmo-bg::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
#root{position:relative;z-index:1}

.ss-chip{transition:transform .34s cubic-bezier(.2,.85,.25,1.05),box-shadow .34s cubic-bezier(.2,.85,.25,1),background .3s ease,color .25s ease,border-color .3s ease,letter-spacing .3s ease}
.ss-chip:active{transform:scale(.95)}
.ss-card{transition:transform .34s cubic-bezier(.2,.85,.25,1),box-shadow .34s cubic-bezier(.2,.85,.25,1)}
.ss-jump{animation:ssJumpFlash 1.9s ease}
@keyframes ssJumpFlash{0%{box-shadow:0 0 0 0 transparent}16%{box-shadow:0 0 0 3px var(--jc,#D4A843),0 0 18px var(--jc,#D4A843)}70%{box-shadow:0 0 0 3px var(--jc,#D4A843),0 0 18px var(--jc,#D4A843)}100%{box-shadow:0 0 0 0 transparent}}
.ss-card:active{transform:translateY(1px)}
.ss-press{transition:transform .2s cubic-bezier(.2,.85,.25,1),box-shadow .2s ease,filter .2s ease}
.ss-press:active{transform:translateY(1px) scale(.985);filter:brightness(1.05)}

/* Avatar images arrive as arbitrary data URIs; PDF image embedding here uses DCTDecode,
   so normalise to JPEG via canvas and report intrinsic pixel size. */
window.ssAvatarToJpeg = function (dataUri, pan, zoom) {
  /* The app frames portraits 3:4 with a cover-fit + user zoom. Reproduce that here so
     the PDF shows the same crop instead of squashing the original into a square.
     NOTE: pan is stored in on-screen CSS pixels relative to the live frame element,
     which is not knowable at export time — applying it blind could push a face out of
     frame, so the crop is centred. Zoom is unitless and is applied faithfully. */
  return new Promise(function (resolve, reject) {
    var settled = false;
    var done = function (fn, v) { if (!settled) { settled = true; fn(v); } };
    setTimeout(function () { done(reject, new Error("avatar timeout")); }, 5000);
    try {
      var img = new Image();
      img.onload = function () {
        try {
          var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
          if (!iw || !ih) return done(reject, new Error("no dimensions"));
          var AR = 3 / 4;                                  // frame aspect, matches the app
          var cw = 384, ch = Math.round(cw / AR);          // 384 x 512 output
          var z = Math.max(1, Math.min(4, +zoom || 1));
          var cover = Math.max(cw / iw, ch / ih) * z;      // cover-fit, then user zoom

      };
      img.onerror = function () { done(reject, new Error("image load failed")); };
      img.src = dataUri;
    } catch (e) { done(reject, e); }
  });
};

const API_URL = 'https://sheetsnap-api.will-6d6.workers.dev';

// Model, max_tokens and the extraction prompt are pinned SERVER-SIDE in the
// Worker (fiscal fortress L4/L7). Extraction runs on Opus, then an independent
// Sonnet pass double-checks every field before results reach the user.
// The client sends ONLY images + a verified Firebase identity token.

// Hard cap on pages per scan (audit H7 / locked decision). Enforced at capture.
const MAX_PAGES = 10;

/* Character slots included with a purchase (launch entitlement). One successful
   scan spends one slot (tracked client-side in ss-scanCount; server-enforced at
   launch). Flip / raise this one constant for heavy testing or at launch. */
const INCLUDED_SLOTS = 3;

/* Downscale a data-URL image to a max long-edge before sending to the API.
   Keeps payload small and predictable (~1568px high-res cap) without hurting
   text legibility. Falls back to the original on any error. */
function downscaleImage(dataUrl, maxDim = 1568, quality = 0.82) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width,
          h = img.naturalHeight || img.height;
        if (!w || !h) {
          resolve(dataUrl);
          return;
        }
        if (Math.max(w, h) > maxDim) {
          const sc = maxDim / Math.max(w, h);
          w = Math.round(w * sc);
          h = Math.round(h * sc);
        }
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        const ctx = c.getContext("2d");
        if (!ctx) {
          resolve(dataUrl);
          return;
        }
        ctx.drawImage(img, 0, 0, w, h);
        try {
          resolve(c.toDataURL("image/jpeg", quality));
        } catch (e) {
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    } catch (e) {
      resolve(dataUrl);
    }
  });
}

  get: k => {
    try {

    } catch (e) {
      return null;

  },
  set: (k, v) => {
    try {
      localStorage.setItem(k, JSON.stringify(v));
      return true;
    } catch (e) {
      if (e.name === "QuotaExceededError" || e.code === 22) {

    function succeed(){
     stop();

     try{sessionStorage.removeItem("ss-sync-reloaded");}catch(e){}
     settle(function(){broadcast();resolve();});
    }
    /* Put the cloud copy back from what is on this device, and REPORT whether it
       worked - never claim a restore that was only attempted. */
    function restoreDoc(){
     var s=JSON.stringify(gather());
     return fsM.setDoc(ref(uid),{sheetsnap_blob:s,sheetsnap_updatedAt:Date.now()},{merge:true})
      .then(function(){last=s;lastSyncedAt=Date.now();errState=false;return true;},function(){errState=true;return false;});
    }

       abandoned chain must still clean up after itself. The tombstone delete is
       driven by ISSUED, not acked (a write whose ack was lost still landed), and
       the per-uid guard is lifted ONLY once it is confirmed gone; otherwise this
       device would resume pushing into a document the rules now refuse, silently. */
    function recover(e,msgFor){
     /* A retired attempt (cancelled, superseded) owns no global state: it never
        armed - ssCancelDelete refuses to retire an armed chain - so it must not
        stop() a live chain's timer, release its deleteBusy, or lift its guard. */
     if(stale()){if(!e.ssMsg)e.ssMsg="Cancelled — nothing has changed.";settle(function(){reject(e);});return;}

     var drop=(tombIssued&&alive)
       ? fsM.deleteDoc(tomb(uid)).then(function(){return true;},function(){return false;})
       : Promise.resolve(!tombIssued);

       if(tombGone)delete deletedUids[uid];
       if(phase>=2&&alive)return restoreDoc().then(function(r){return {tombGone:tombGone,restored:r,gone:!alive};});

     }).catch(function(){stop();settle(function(){broadcast();reject(e);});});

       trapped in a modal - but leave the guards standing so the chain can still
       finish or roll back, and so a second attempt is refused meanwhile. */

     broadcast();

           place. Success arrives twice over (h.ok(), and the poll above, because

          catch(_e){nativeReauth=null;}   /* handler vanished mid-flight — fall through to the popup */
        }

            if(pid==="apple.com")keepTok(rres);   /* Google credentials also carry an accessToken - never store one as if it were Apple's */
            finish(true);

               user can act on beats a spinner that never resolves. */

       cancelled, so the UI keeps an escape open for the whole step. */
    raceOut(reauthStep(),REAUTH_MS,

    .then(function(){
     if(stale())throw derr("cancelled","Cancelled — nothing has changed.");
     var cur=auth.currentUser;
     if(!cur||cur.uid!==uid)throw derr("identity-changed","Something changed while we were working. Nothing has been deleted — please try again.");

     return raceOut(cur.getIdToken(true),30000,derr("token-timeout","We couldn't confirm your sign-in just now. Nothing has been changed — please try again."));

     if(opts.onDestructive){try{opts.onDestructive();}catch(_){}}   /* past the point of cancelling */

     deleteTimer=setTimeout(timedOut,DESTRUCT_MS);
     /* STEP 2 - tombstone, before anything is destroyed. merge:true so a retry after
        a lost ack is a harmless no-op rather than a permanent brick. */
     tombIssued=true;
     return fsM.setDoc(tomb(uid),{deletedAt:Date.now()},{merge:true});
    }).then(function(){
     phase=1;
     /* STEP 3 - the cloud copy. Characters on this device are deliberately kept. */
     return fsM.deleteDoc(ref(uid));
    }).then(function(){
     phase=2;
     var c2=auth.currentUser;
     if(!c2||c2.uid!==uid)throw derr("identity-changed","Your cloud copy was removed, but we could not finish deleting the account. Please sign in and try again.");

        review rejection. MUST run BEFORE deleteUser: revokeAccessToken is a no-op when
        currentUser is null, so calling it after would silently do nothing.
        Best-effort by design - a failure here must never strand a user who has already
        lost their cloud copy - so the outcome is recorded and deletion continues.
        Re-armed against DESTRUCT_MS because a hung revoke would otherwise consume a
        third of the budget and report a false timeout on a deletion that succeeded. */
     var lastRevoked="";

        then revoke the token exchanged" — and that is exactly what Firebase's own iOS

        idToken, and no redirectUri. Same endpoint, same field set, called directly. */
     function revokeByCode(code){
       var cu2=auth.currentUser;
       if(!cu2)return Promise.reject(new Error("revoke-no-user"));
       return cu2.getIdToken().then(function(it){
         return fetch("https://identitytoolkit.googleapis.com/v2/accounts:revokeToken?key="+encodeURIComponent(cfg.apiKey),
           {method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({providerId:"apple.com",tokenType:"CODE",token:code,idToken:it})});
       }).then(function(r){

                              function(){throw new Error("revoke-http-"+(r&&r.status));});

       var isApple=false;
       try{isApple=(cu.providerData||[]).some(function(p){return p&&p.providerId==="apple.com";});}catch(_){}

       lastRevoked=grant;
       return raceOut(useCode?revokeByCode(code):authM.revokeAccessToken(auth,tok),8000,derr("revoke-timeout","Revoking the Apple sign-in took too long."))
         .then(function(){window.ssLastRevoke={ok:true,attempted:true,skipped:false,via:useCode?"code":"access-token"};},
               function(err){window.ssLastRevoke={ok:false,attempted:true,skipped:false,via:useCode?"code":"access-token",code:(err&&(err.code||err.message))||""};
                             try{console.warn("Sheetmancer: Apple token revocation failed",err);}catch(_){}})
         .then(function(){if(deleteTimer){clearTimeout(deleteTimer);deleteTimer=setTimeout(timedOut,DESTRUCT_MS);}});
     }
     return doRevoke(c2).then(function(){
     /* STEP 4 - the auth user itself. If Firebase still judges the sign-in too old,
        reauthenticate and retry ONCE rather than stopping here with the cloud copy

     return authM.deleteUser(c2).catch(function(e){
       if(!e||e.code!=="auth/requires-recent-login")throw e;
       if(deleteTimer){clearTimeout(deleteTimer);deleteTimer=null;}   /* the popup may outlive DESTRUCT_MS */
       return reauthStep().then(function(){
         var c3=auth.currentUser;
         if(!c3||c3.uid!==uid)throw derr("identity-changed","Your cloud copy was removed, but we could not finish deleting the account. Please sign in and try again.");
         deleteTimer=setTimeout(timedOut,DESTRUCT_MS);

         return doRevoke(c3).then(function(){return authM.deleteUser(c3);});
       });
     });
     });
    }).then(function(){
     phase=3;
     /* STEP 5 - server-side purge. Best effort: the account is already gone, and a
        failure here must never look like a failed deletion to the user. The outcome

     return raceOut(fetch(SS_API+"/account",{method:"DELETE",headers:{Authorization:"Bearer "+savedTok}}),15000,derr("purge-timeout","purge timed out"))
      .then(function(r){window.ssLastPurge={ok:!!r.ok,status:r.status};if(!r.ok)try{console.warn("Sheetmancer: account purge returned "+r.status);}catch(_){}},
            function(err){window.ssLastPurge={ok:false,status:0};try{console.warn("Sheetmancer: account purge failed",err);}catch(_){}});
    }).then(succeed).catch(function(e){

       if(phase>=3)return "Your account was removed, but we couldn't confirm the last step. Nothing more is needed on this device — the characters here are safe.";

      }

        ? "We removed your cloud copy but couldn't delete the account itself. The characters on this device are safe, and the cloud copy has been put back."

      }

    });

  };
  function ref(uid){return fsM.doc(db,"users",uid);}
  function push(){if(!user)return;
   /* Blocked, not synced - a delete in flight or a tombstone standing. Say so. */
   if(deleting||deletedUids[user.uid]){if(!errState){errState=true;broadcast();}return;}
   var uu=user.uid;var s=JSON.stringify(gather());if(s===last)return;last=s;syncing=true;broadcast();fsM.setDoc(ref(uu),{sheetsnap_blob:s,sheetsnap_updatedAt:Date.now()},{merge:true}).then(function(){lastSyncedAt=Date.now();syncing=false;errState=false;broadcast();}).catch(function(e){syncing=false;errState=true;if(/permission/i.test(String((e&&(e.code||e.message))||"")))deletedUids[uu]=1;else last="";broadcast();});}

     an OLD tombstone (older than the few seconds a real deletion takes) is reconciled:

     the tombstone when the account provably still exists. A young tombstone is left
     alone so a deletion in flight on another device is never undone. */
  var TOMB_STRANDED_MS=300000;
  function reconcile(u){
   return fsM.getDoc(tomb(u.uid)).then(function(t){
    if(!t.exists())return true;
    var at=((t.data()||{}).deletedAt)||0;
    if(Date.now()-at<TOMB_STRANDED_MS)return true;
    return u.getIdToken(true).then(function(){
     return fsM.deleteDoc(tomb(u.uid)).then(function(){delete deletedUids[u.uid];return true;},function(){return true;});
    },function(err){
     var c=String((err&&(err.code||err.message))||"");
     /* Only these PROVE the account is gone. A network blip must never sign anyone out. */
     if(/user-token-expired|user-not-found|user-disabled|invalid-user-token/i.test(c)){try{authM.signOut(auth);}catch(e){}return false;}
     errState=true;return true;
    });
   },function(){return true;});
  }
  function loadCloud(u){
    return fsM.getDoc(ref(u.uid)).then(function(snap){
     var d=snap.exists()?snap.data():null;
     if(d&&d.sheetsnap_blob){try{var c=JSON.parse(d.sheetsnap_blob);if(apply(c)&&!sessionStorage.getItem("ss-sync-reloaded")){sessionStorage.setItem("ss-sync-reloaded","1");location.reload();return;}}catch(e){}}
     last=JSON.stringify(gather());lastSyncedAt=Date.now();syncing=false;errState=false;broadcast();push();
    }).catch(function(e){syncing=false;errState=navigator.onLine;broadcast();});

 }).catch(function(){window.ssAuth={signedIn:false,email:"",status:"Sign in",detail:"sync offline"};try{window.dispatchEvent(new CustomEvent("ss-auth"));}catch(e){}});
})();</script>
