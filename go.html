<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheetmancer</title>
<!-- Smart store link for paid social ads (Will 2026-11-14: ads go straight to the point of purchase).
     iPhone/iPad -> App Store, Android -> Google Play, anything else -> the About page.
     Ad link: https://sheetmancer.digirunestudios.com/go.html?utm_source=igad  (the tag reaches both stores).
     Kept out of search; not in sitemap.xml. -->
<meta name="robots" content="noindex, nofollow">
<script>
(function(){
  var m=/[?&]utm_source=([^&#]+)/.exec(location.search);
  var src=m?decodeURIComponent(m[1]).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30):'';
  var tag='sm-'+(src||'ad');
  var ua=navigator.userAgent||'';
  var ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var android=/Android/.test(ua);
  var url=ios?'https://apps.apple.com/app/sheetmancer-character-sheets/id6793684089?pt=128989957&ct='+tag+'&mt=8'
        :android?'https://play.google.com/store/apps/details?id=com.digirunestudios.sheetmancer&referrer='+encodeURIComponent('utm_source='+tag+'&utm_medium=social&utm_campaign=ad')
        :'https://sheetmancer.digirunestudios.com/about.html?utm_source='+encodeURIComponent(src||'ad');
  window.__go=url;
  // TikTok on iPhone blocks App Store links in its own browser (tested 2026-11-14): show a way out instead of a blank page.
  window.__tt=ios&&url.indexOf('apps.apple.com')>-1&&/musical_ly|BytedanceWebview|TikTok|trill/i.test(ua);
  if(!window.__tt) location.replace(url);
})();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E0A08;color:#D9CBB0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  .box{max-width:340px}
  img{width:72px;height:72px;border-radius:17px;margin:0 auto 16px;display:block}
  p{margin:0 0 18px;font-size:16px}
  a{display:inline-block;background:#D6A852;color:#1a1008;font-weight:700;text-decoration:none;border-radius:12px;padding:14px 26px;font-size:17px}
  #fb{visibility:hidden}
</style>
</head>
<body>
  <div class="box">
    <img src="./icon-192.png" alt="Sheetmancer app icon" width="72" height="72">
    <p>Opening the store&hellip;</p>
    <div id="fb"><a id="btn" href="https://sheetmancer.digirunestudios.com/about.html">Tap to open the store</a></div>
  </div>
  <div id="tt" class="box" style="display:none">
    <img src="./icon-192.png" alt="Sheetmancer app icon" width="72" height="72">
    <p><b>TikTok can&rsquo;t open the App Store from here.</b></p>
    <p>Tap <b>&bull;&bull;&bull;</b> at the top right, then <b>Open in browser</b>.</p>
    <div style="margin:0 0 18px"><a id="saf" href="#">Open in Safari</a></div>
    <p style="font-size:14px;opacity:.8">Or open the App Store and search <b>Sheetmancer</b>.</p>
  </div>
<script>
  /* If the redirect hasn't happened after a moment (some in-app browsers block it), show one tap. */
  document.getElementById('btn').href=window.__go||document.getElementById('btn').href;
  if(window.__tt){document.querySelector('body>div').style.display='none';document.getElementById('tt').style.display='block';document.getElementById('saf').href='x-safari-'+location.href;}
  else setTimeout(function(){document.getElementById('fb').style.visibility='visible';},1200);
</script>
</body>
</html>
