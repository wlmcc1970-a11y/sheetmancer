name: Publish Sheetmancer

# Runs every time Will pushes to main from GitHub Desktop — the same habit as
# before, just landing on Firebase Hosting (and therefore on the branded domain)
# instead of GitHub Pages. Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# KEYLESS AUTH (Workload Identity Federation). There is no stored credential
# anywhere in this repo. GitHub mints a short-lived identity token for this
# workflow, Google verifies it came from this repository, and hands back a pass
# that expires in minutes. Nothing to leak, nothing to rotate, and Will's
# organisation policy blocking downloadable service-account keys stays ON.
permissions:
  contents: read # read this repo
  id-token: write # allow GitHub to mint the identity token

jobs:
  publish:
    name: Deploy to sheetmancer.digirunestudios.com
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Prove who we are to Google (no key involved)
        uses: google-github-actions/auth@v3
        with:
          project_id: sheetmancer-app
          workload_identity_provider: projects/993832930737/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions-publisher@sheetmancer-app.iam.gserviceaccount.com

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      # Uses the short-lived credentials from the auth step above
      # (GOOGLE_APPLICATION_CREDENTIALS is set for us).
      - name: Publish
        run: firebase deploy --only hosting --project sheetmancer-app --non-interactive
